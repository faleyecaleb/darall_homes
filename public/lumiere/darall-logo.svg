<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 70" width="100%" height="100%">
    <!-- Horizontal Bottom Line (Vivid Brand Red) -->
    <line x1="10" y1="58" x2="210" y2="58" stroke="#d10a14" stroke-width="2.5" stroke-linecap="round" />
    
    <!-- Vertical Wall Line (Adaptive Color) -->
    <line x1="22" y1="33" x2="22" y2="58" stroke="currentColor" stroke-opacity="0.6" stroke-width="2" stroke-linecap="round" />
    
    <!-- Red Outer Roof Slope (Vivid Brand Red) -->
    <path d="M12 34 L32 18 L52 34" fill="none" stroke="#d10a14" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Red Parallel Roof Accent Lines/Rafters -->
    <line x1="38" y1="18" x2="54" y2="34" stroke="#d10a14" stroke-width="2" stroke-linecap="round" />
    <line x1="44" y1="18" x2="60" y2="34" stroke="#d10a14" stroke-width="2" stroke-linecap="round" />
    
    <!-- Red Window Panes (2x2 Grid) -->
    <rect x="27" y="25" width="5" height="5" fill="#d10a14" />
    <rect x="33" y="25" width="5" height="5" fill="#d10a14" />
    <rect x="27" y="31" width="5" height="5" fill="#d10a14" />
    <rect x="33" y="31" width="5" height="5" fill="#d10a14" />
    
    <!-- Adaptive Styled Text (Darall Homes) -->
    <text x="64" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="700" font-size="20" letter-spacing="0.5" fill="currentColor">Darall</text>
    <text x="130" y="48" font-family="'Plus Jakarta Sans', 'Segoe UI', -apple-system, sans-serif" font-weight="300" font-size="20" letter-spacing="0.5" fill="currentColor">Homes</text>
</svg>
